name: Embed Happy Orc maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/embed-happy-orc-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch adventure JSON
        shell: python
        run: |
          import json, time, pathlib

          p = pathlib.Path('Trouble_at_Grogs_5etools_CURRENT.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          repo = 'https://raw.githubusercontent.com/sefjoe/trouble-at-grogs-5etools/main'
          social_url = repo + '/img/player/happy_orc_social.webp'
          combat_url = repo + '/img/dm/happy_orc_combat.webp'

          def image_obj(url, image_type, title, area):
              return {
                  'type': 'image',
                  'href': {'type': 'external', 'url': url},
                  'imageType': image_type,
                  'title': title,
                  'grid': {'type': 'none'},
                  'mapRegions': [{'area': area, 'points': [[0,0],[1,0],[1,1],[0,1]]}],
              }

          social = image_obj(social_url, 'mapPlayer', 'The Happy Orc — Social Setup', 'tgh-happy-orc-social')
          combat = image_obj(combat_url, 'map', 'The Happy Orc — Combat Setup', 'tgh-happy-orc-combat')

          social_link = '{@link Open Social Map|' + social_url + '}'
          combat_link = '{@link Open Combat Map|' + combat_url + '}'

          found_social = found_combat = False
          for section in data.get('adventureData', [])[0].get('data', []):
              for ent in section.get('entries', []):
                  if ent.get('id') == '101' and ent.get('name') == 'Physical Map — Locked Build':
                      entries = ent.setdefault('entries', [])
                      entries[:] = [e for e in entries if not (isinstance(e, dict) and e.get('type') == 'image' and 'Happy Orc' in e.get('title','')) and e != social_link]
                      entries.insert(0, social)
                      entries.insert(1, social_link)
                      found_social = True
                  if ent.get('name') == 'Combat Map — Locked Build':
                      entries = ent.setdefault('entries', [])
                      entries[:] = [e for e in entries if not (isinstance(e, dict) and e.get('type') == 'image' and 'Happy Orc' in e.get('title','')) and e != combat_link]
                      entries.insert(0, combat)
                      entries.insert(1, combat_link)
                      found_combat = True

          if not (found_social and found_combat):
              raise SystemExit(f'Expected map sections not found: social={found_social}, combat={found_combat}')

          src = data['_meta']['sources'][0]
          src['version'] = '1.8-embedded-maps'
          now = int(time.time())
          data['_meta']['dateLastModified'] = now
          src['dateLastModified'] = now
          data['_meta']['_dateLastModifiedHash'] = hex(now)[2:]

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove this one-shot workflow after it has done its job.
          pathlib.Path('.github/workflows/embed-happy-orc-maps.yml').unlink()
      - name: Commit patched JSON
        run: |
          git config user.name "ChatGPT map embed"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Embed Happy Orc social and combat maps in 5eTools adventure"
          git push
