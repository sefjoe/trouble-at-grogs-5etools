name: Rebuild Trouble at Grog's current with embedded maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-current-with-maps.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate CURRENT
        shell: python
        run: |
          import json, pathlib
          parts = [pathlib.Path('.staging/tg18_0.txt').read_text(encoding='utf-8'), pathlib.Path('.staging/tg18_1.txt').read_text(encoding='utf-8')]
          text = ''.join(parts)
          data = json.loads(text)
          out = pathlib.Path('Trouble_at_Grogs_5etools_CURRENT.json')
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(out.read_text(encoding='utf-8'))
          pathlib.Path('.staging/tg18_0.txt').unlink()
          pathlib.Path('.staging/tg18_1.txt').unlink()
          pathlib.Path('.github/workflows/rebuild-current-with-maps.yml').unlink()
      - name: Commit rebuilt adventure
        run: |
          git config user.name "ChatGPT map embed"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Embed Happy Orc social and combat maps in current adventure"
          git push
